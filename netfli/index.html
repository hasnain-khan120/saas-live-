<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h1 id="logo">Netflix</h1>
        <button ID="Sign-in">Sign-in</button>
    </nav>
    <main>
        <section id="main">
        <div id="para">
            <h1>Unlimited movies, TV Shows<br>and more</h1>
            <br>
            <p>Watch anywhere. Cancel anytime.</p>
        <br>
        <span id="search">
            <input type="email" placeholder="   Email address" id="email">
            <button id="button">Get Started</button>
            </span>
        </div>
        </section>
            <div id="line"></div>
        <section id="trend">
            
            <h1 id="heading">Trending Now</h1>
        <div class="hero">
        <div style="background-color: red;" >Movie1</div>
        <div style="background-color: blue;">Movie2</div>
        <div style="background-color: green;">Movie3</div>
        <div style="background-color: orangered;">Movie4</div>
        <div style="background-color: purple;">Movie5</div>
        <div style="background-color: skyblue;">Movie6</div>
        <div style="background-color: purple;">Movie5</div>
        <div style="background-color: rgb(72, 28, 72);">Movie5</div>
        </div>
        <h1 id="heading2">Popular on Netflix</h1>
        <div class="hero2">
        <div style="background-color: red;" >Movie1</div>
        <div style="background-color: blue;">Movie2</div>
        <div style="background-color: green;">Movie3</div>
        <div style="background-color: orangered;">Movie4</div>
        <div style="background-color: purple;">Movie5</div>
        <div style="background-color: skyblue;">Movie6</div>
        <div style="background-color: purple;">Movie5</div>
        <div style="background-color: rgb(58, 28, 58);">Movie5</div>
        </div>
        <div class="container">

        </div>
        </section>
        
    </main>
    
</body>
</html>
